name: FARBI live endpoint verification

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/farbi-live-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out published origin
        uses: actions/checkout@v4

      - name: Probe stable and origin auth paths
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN=$(python -c 'import json; print(json.load(open("farbi-live-origin.json"))["origin"])')
          STABLE="https://farbi-marketplace.omar-gassab.chatgpt.site"

          probe() {
            local url="$1"
            echo "=== $url ==="
            curl -sSI --max-time 20 "$url" | sed -n '1,25p' || true
          }

          probe "$ORIGIN/login"
          probe "$ORIGIN/register"
          probe "$ORIGIN/signin"
          probe "$ORIGIN/signup"
          probe "$STABLE/login"
          probe "$STABLE/register"
          probe "$STABLE/signin"
          probe "$STABLE/signup"
          probe "$STABLE/__farbi_probe_missing"
