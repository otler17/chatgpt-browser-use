name: Temporary Habibi Tunisia Reel Voice

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-habibi-arabic-tts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Habibi TTS CPU runtime
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -U pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.6.0+cpu' 'torchaudio==2.6.0+cpu' 'torchvision==0.21.0+cpu'
          python -m pip install 'habibi-tts==0.1.1'

      - name: Patch float waveform export headroom
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import pathlib, sysconfig
          p = pathlib.Path(sysconfig.get_paths()['purelib']) / 'habibi_tts' / 'infer' / 'infer_cli.py'
          s = p.read_text()
          old = 'final_wave = np.concatenate(generated_audio_segments)'
          new = '''final_wave = np.concatenate(generated_audio_segments)\n        peak = float(np.max(np.abs(final_wave))) if final_wave.size else 0.0\n        print(f"pre_export_float_peak={peak:.9f}")\n        if peak > 0.94:\n            final_wave = final_wave * (0.94 / peak)\n            print(f"scaled_float_peak={float(np.max(np.abs(final_wave))):.9f}")'''
          if old not in s: raise SystemExit('export hook not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Generate Tunisia narration with 32-step solver
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          TEXT='أول مرة أزور تونس، وكنت أظنها مجرد شواطئ. بعد ساعة ضعت في المدينة العتيقة، ولم أرد أن أخرج. أول قضمة بريك؟ انتهت مقاومتي. ثم سيدي بوسعيد: أبيض، أزرق، والبحر كأنه لوحة. في قرطاج، التاريخ تحت قدمي. وفي الجم، مدرج روماني جعلني أشعر أنني داخل فيلم. بعدها اتجهت جنوباً: واحات توزر، شط الجريد، بيوت مطماطة، ثم صحراء دوز عند الغروب. وفي الليل، صمت الصحراء كان أقوى من أي موسيقى. ختمت الرحلة في جربة، بين الأزقة والبحر والكسكسي. جئت أبحث عن عطلة، وغادرت بسؤال واحد: لماذا لم آتِ من قبل؟ وأنت، أين تبدأ؟'
          REF='كان اللعيب حاضرًا في العديد من الأنشطة والفعاليات المرتبطة بكأس العالم، مما سمح للجماهير بالتفاعل معه والتقاط الصور التذكارية.'
          printf '%s\n' "$TEXT" > out/narration_ar.txt
          habibi-tts_infer-cli \
            --model Specialized \
            --dialect MSA \
            --ref_audio assets/MSA.mp3 \
            --ref_text "$REF" \
            --gen_text "$TEXT" \
            --nfe_step 32 \
            --cfg_strength 2.0 \
            --target_rms 0.07 \
            --speed 1.0 \
            --device cpu \
            --output_dir out \
            --output_file tunisia_raw.wav
          ffprobe -v error -show_entries stream=codec_name,sample_rate,channels -show_entries format=duration -of default=nw=1 out/tunisia_raw.wav

      - name: Fit narration to 32 seconds and QC
        shell: bash
        run: |
          set -euxo pipefail
          DUR=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 out/tunisia_raw.wav)
          python - "$DUR" <<'PY' > /tmp/filter.txt
          import sys
          d=float(sys.argv[1]); target=32.0
          ratio=d/target
          filters=[]
          while ratio > 2.0:
              filters.append('atempo=2.0'); ratio/=2.0
          while ratio < 0.5:
              filters.append('atempo=0.5'); ratio/=0.5
          filters.append(f'atempo={ratio:.9f}')
          print(','.join(filters))
          PY
          FILTER=$(cat /tmp/filter.txt)
          ffmpeg -y -v error -i out/tunisia_raw.wav -af "$FILTER" -t 32.000 -ar 24000 -ac 1 -c:a pcm_s16le out/tunisia_voice_32s.wav
          python - <<'PY'
          import numpy as np, soundfile as sf
          from scipy.signal import welch
          p='out/tunisia_voice_32s.wav'
          x,sr=sf.read(p, dtype='float32')
          peak=float(np.max(np.abs(x))) if len(x) else 0.0
          sat=int(np.sum(np.abs(x)>=0.9999))
          f,P=welch(x, sr, nperseg=min(8192,len(x)))
          mask=(f>=80)&(f<=12000); hi=(f>=6000)&(f<=12000)
          total=float(P[mask].sum()); ratio=float(P[hi].sum()/total) if total else 0.0
          print('duration',len(x)/sr,'peak',peak,'saturated_samples',sat,'hf_6_12k_ratio',ratio)
          if abs(len(x)/sr-32.0) > 1/sr: raise SystemExit('duration mismatch')
          if peak >= 0.985 or sat: raise SystemExit('clipping/headroom failure')
          if ratio > 0.20: raise SystemExit('excess high-frequency energy')
          PY

      - name: Upload Tunisia voice
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: habibi-tunisia-reel-voice
          path: |
            out/tunisia_voice_32s.wav
            out/tunisia_raw.wav
            out/narration_ar.txt
          if-no-files-found: warn
          retention-days: 1

# tunisia reel voice