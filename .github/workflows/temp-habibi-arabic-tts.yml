name: Temporary Habibi Tunisia Reel Voice

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-habibi-arabic-tts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synthesize:
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 32
    env:
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Habibi TTS CPU runtime
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -U pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            'torch==2.6.0+cpu' 'torchaudio==2.6.0+cpu' 'torchvision==0.21.0+cpu'
          python -m pip install 'habibi-tts==0.1.1'

      - name: Patch float waveform export headroom
        shell: bash
        run: |
          set -euxo pipefail
          python - <<'PY'
          import pathlib, sysconfig
          p = pathlib.Path(sysconfig.get_paths()['purelib']) / 'habibi_tts' / 'infer' / 'infer_cli.py'
          s = p.read_text()
          old = 'final_wave = np.concatenate(generated_audio_segments)'
          new = '''final_wave = np.concatenate(generated_audio_segments)\n        peak = float(np.max(np.abs(final_wave))) if final_wave.size else 0.0\n        print(f"pre_export_float_peak={peak:.9f}")\n        if peak > 0.94:\n            final_wave = final_wave * (0.94 / peak)\n            print(f"scaled_float_peak={float(np.max(np.abs(final_wave))):.9f}")'''
          if old not in s: raise SystemExit('export hook not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Generate part ${{ matrix.part }} at 32 steps
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p out
          if [ '${{ matrix.part }}' = '1' ]; then
            TEXT='أول مرة أزور تونس، وكنت أظنها مجرد شواطئ. بعد ساعة ضعت في المدينة العتيقة، ولم أرد أن أخرج. أول قضمة بريك؟ انتهت مقاومتي. ثم سيدي بوسعيد: أبيض، أزرق، والبحر كأنه لوحة. في قرطاج، التاريخ تحت قدمي. وفي الجم، مدرج روماني جعلني أشعر أنني داخل فيلم.'
          else
            TEXT='بعدها اتجهت جنوباً: واحات توزر، شط الجريد، بيوت مطماطة، ثم صحراء دوز عند الغروب. وفي الليل، صمت الصحراء كان أقوى من أي موسيقى. ختمت الرحلة في جربة، بين الأزقة والبحر والكسكسي. جئت أبحث عن عطلة، وغادرت بسؤال واحد: لماذا لم آتِ من قبل؟ وأنت، أين تبدأ؟'
          fi
          REF='كان اللعيب حاضرًا في العديد من الأنشطة والفعاليات المرتبطة بكأس العالم، مما سمح للجماهير بالتفاعل معه والتقاط الصور التذكارية.'
          printf '%s\n' "$TEXT" > out/text.txt
          habibi-tts_infer-cli \
            --model Specialized \
            --dialect MSA \
            --ref_audio assets/MSA.mp3 \
            --ref_text "$REF" \
            --gen_text "$TEXT" \
            --nfe_step 32 \
            --cfg_strength 2.0 \
            --target_rms 0.07 \
            --speed 1.0 \
            --device cpu \
            --output_dir out \
            --output_file raw.wav
          DUR=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 out/raw.wav)
          python - "$DUR" <<'PY' > /tmp/filter.txt
          import sys
          d=float(sys.argv[1]); target=16.0
          ratio=d/target; filters=[]
          while ratio > 2.0: filters.append('atempo=2.0'); ratio/=2.0
          while ratio < 0.5: filters.append('atempo=0.5'); ratio/=0.5
          filters.append(f'atempo={ratio:.9f}')
          print(','.join(filters))
          PY
          ffmpeg -y -v error -i out/raw.wav -af "$(cat /tmp/filter.txt)" -t 16.000 -ar 24000 -ac 1 -c:a pcm_s16le out/part.wav
          python - <<'PY'
          import numpy as np, soundfile as sf
          from scipy.signal import welch
          x,sr=sf.read('out/part.wav',dtype='float32')
          peak=float(np.max(np.abs(x))); sat=int(np.sum(np.abs(x)>=0.9999))
          f,P=welch(x,sr,nperseg=min(8192,len(x))); m=(f>=80)&(f<=12000); h=(f>=6000)&(f<=12000)
          r=float(P[h].sum()/P[m].sum())
          print('duration',len(x)/sr,'peak',peak,'sat',sat,'hf',r)
          if abs(len(x)/sr-16)>1/sr or peak>=0.985 or sat or r>0.20: raise SystemExit('QC failure')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: habibi-part-${{ matrix.part }}
          path: |
            out/part.wav
            out/text.txt
          retention-days: 1

  assemble:
    needs: synthesize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: habibi-part-1
          path: parts/1
      - uses: actions/download-artifact@v4
        with:
          name: habibi-part-2
          path: parts/2
      - name: Assemble, QC, and commit known output path
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-numpy python3-scipy python3-soundfile
          mkdir -p generated
          printf "file '%s'\nfile '%s'\n" "$PWD/parts/1/part.wav" "$PWD/parts/2/part.wav" > /tmp/list.txt
          ffmpeg -y -v error -f concat -safe 0 -i /tmp/list.txt -ar 24000 -ac 1 -c:a pcm_s16le generated/tunisia_habibi_voice_32s.wav
          cat parts/1/text.txt parts/2/text.txt > generated/tunisia_habibi_narration_ar.txt
          python3 - <<'PY'
          import numpy as np, soundfile as sf
          from scipy.signal import welch
          p='generated/tunisia_habibi_voice_32s.wav'
          x,sr=sf.read(p,dtype='float32')
          peak=float(np.max(np.abs(x))); sat=int(np.sum(np.abs(x)>=0.9999))
          f,P=welch(x,sr,nperseg=min(8192,len(x))); m=(f>=80)&(f<=12000); h=(f>=6000)&(f<=12000)
          r=float(P[h].sum()/P[m].sum())
          print('FINAL duration',len(x)/sr,'peak',peak,'sat',sat,'hf',r)
          if abs(len(x)/sr-32)>1/sr or peak>=0.985 or sat or r>0.20: raise SystemExit('final QC failure')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generated/tunisia_habibi_voice_32s.wav generated/tunisia_habibi_narration_ar.txt
          git commit -m 'Add Habibi Tunisia reel narration' || exit 0
          git push

# parallel Tunisia reel voice