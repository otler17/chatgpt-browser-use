name: Temporary YouTube availability test

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-supercar-download.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test requested video
        shell: bash
        run: |
          set -euxo pipefail
          VIDEO_ID='PtdI0KZRTLU'
          TARGET='https://www.youtube.com/watch?v=PtdI0KZRTLU'
          curl -L --fail --retry 2 -A 'Mozilla/5.0' "https://www.youtube.com/oembed?url=${TARGET}&format=json" -o oembed.json || true
          cat oembed.json || true
          curl -L --fail --retry 2 -A 'Mozilla/5.0' "https://archive.ventilaar.net/watch?v=${VIDEO_ID}" -o archive.html || true
          if [ -s archive.html ]; then
            grep -Eio '.{0,120}(source src|mp4|webm|PtdI0KZRTLU).{0,200}' archive.html | head -n 30 || true
          fi
