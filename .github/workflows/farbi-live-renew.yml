name: FARBI live host renewer

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/farbi-live-renew.yml"
  schedule:
    - cron: "15 */5 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start a fresh FARBI host run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run farbi-live-host.yml --repo "$GITHUB_REPOSITORY" --ref master
          echo "Dispatched FARBI host renewal."
