name: Temporary supercar video download

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-supercar-download.yml'

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download public supercar stream
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, re, subprocess, urllib.request

          videos = [
              ('KidzSnnCJKU', 'POLICE vs SUPERCARS in Monaco!'),
              ('fMqTRIhfJXk', 'Real 4K HDR: TCL Supercars in HDR'),
          ]
          headers = {'User-Agent': 'Mozilla/5.0'}
          with urllib.request.urlopen(urllib.request.Request('https://api.invidious.io/instances.json?sort_by=health', headers=headers), timeout=30) as r:
              instances = json.load(r)

          bases = []
          for host, meta in instances:
              if not isinstance(meta, dict) or not meta.get('api'):
                  continue
              uri = meta.get('uri') or ('https://' + host)
              if uri.startswith('https://'):
                  bases.append(uri.rstrip('/'))
          print('API instances:', bases[:30], flush=True)

          for video_id, fallback_title in videos:
              for base in bases[:40]:
                  try:
                      req = urllib.request.Request(f'{base}/api/v1/videos/{video_id}', headers=headers)
                      with urllib.request.urlopen(req, timeout=15) as r:
                          data = json.load(r)
                      streams = data.get('formatStreams') or []
                      choices = []
                      for s in streams:
                          url = s.get('url')
                          label = s.get('qualityLabel') or s.get('quality') or ''
                          m = re.search(r'(\d+)', label)
                          height = int(m.group(1)) if m else 0
                          if url and height and height <= 720:
                              choices.append((height, s))
                      if not choices:
                          continue
                      choices.sort(key=lambda x: x[0], reverse=True)
                      stream = choices[0][1]
                      subprocess.run(['curl','-L','--fail','--retry','3','--max-time','300','-o','source.mp4',stream['url']], check=True, timeout=330)
                      subprocess.run(['ffprobe','-v','error','source.mp4'], check=True, timeout=30)
                      open('source_title.txt','w').write((data.get('title') or fallback_title) + '\n')
                      open('source_url.txt','w').write(f'https://www.youtube.com/watch?v={video_id}\n')
                      raise SystemExit(0)
                  except Exception as e:
                      print(f'{base} / {video_id}: {e}', flush=True)
          raise SystemExit('No Invidious stream source succeeded')
          PY
          test -s source.mp4
          ls -lh source.mp4 source_url.txt source_title.txt

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: supercar-source
          path: |
            source.mp4
            source_url.txt
            source_title.txt
          if-no-files-found: error
          retention-days: 1
