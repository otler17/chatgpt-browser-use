name: FARBI exact project live host

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/farbi-live-host.yml"
      - ".github/farbi-bundle/**"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  farbi:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: farbi_user
          POSTGRES_PASSWORD: farbi_password
          POSTGRES_DB: farbi_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U farbi_user -d farbi_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: development
      SECRET_KEY: farbi-actions-demo-secret-${{ github.run_id }}-${{ github.run_attempt }}
      DATABASE_URL: postgresql://farbi_user:farbi_password@127.0.0.1:5432/farbi_db
      REDIS_URL: redis://127.0.0.1:6379/0
      PAYMENT_WEBHOOK_SECRET: farbi-actions-webhook-${{ github.run_id }}
      OFFLINE_LOCAL_MODE: "true"
      STORAGE_BACKEND: local
      LOCAL_UPLOAD_ROOT: instance/local_uploads
      EMAIL_BACKEND: local
      LOCAL_EMAIL_OUTBOX: instance/offline_emails
      PAYMENT_PROVIDER: mock
      MAIN_APP_DOMAINS: farbi-otler17.trapdoor.sh,localhost,127.0.0.1
      PUBLIC_AUTH_ORIGIN: https://farbi-otler17.trapdoor.sh
      FARBI_FIXED_URL: https://farbi-otler17.trapdoor.sh

    steps:
      - name: Check out runtime bundle
        uses: actions/checkout@v4

      - name: Restore the exact uploaded project
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON=$(curl -fsS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=farbi-sites-bootstrap")
          OIDC_TOKEN=$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$OIDC_JSON")
          FARBI_BUNDLE_KEY=$(curl -fsS \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            https://farbi-marketplace.omar-gassab.chatgpt.site/.well-known/farbi-bundle-key)
          export FARBI_BUNDLE_KEY
          cat .github/farbi-bundle/*.enc | openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass env:FARBI_BUNDLE_KEY -out farbi-project.zip
          mkdir farbi-project
          unzip -q farbi-project.zip -d farbi-project
          test -f farbi-project/application.py
          test -f farbi-project/migrations/versions/000000000001_baseline_schema.py

      - name: Adapt auth routes for stable tunnel hosting
        working-directory: farbi-project
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from pathlib import Path; p=Path("application.py"); s=p.read_text(encoding="utf-8"); old="def require_platform_host_for_auth():\n    if request.endpoint not in SENSITIVE_AUTH_ENDPOINTS:\n        return None"; new="def require_platform_host_for_auth():\n    if current_app.config.get(\"OFFLINE_LOCAL_MODE\"):\n        return None\n    if request.endpoint not in SENSITIVE_AUTH_ENDPOINTS:\n        return None"; assert old in s, "Expected auth host guard not found"; s=s.replace(old,new,1); q=chr(39); register=f"@app.route({q}/register{q}, methods=[{q}GET{q}, {q}POST{q}])"; login=f"@app.route({q}/login{q}, methods=[{q}GET{q}, {q}POST{q}])"; assert register in s and login in s, "Expected auth route decorators not found"; s=s.replace(register,register.replace("/register","/signup"),1).replace(login,login.replace("/login","/signin"),1); p.write_text(s,encoding="utf-8")'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: farbi-project/requirements/prod.txt

      - name: Install exact application dependencies
        id: dependencies
        working-directory: farbi-project
        run: python -m pip install -r requirements/prod.txt

      - name: Apply PostgreSQL migrations and seed integration users
        id: database
        working-directory: farbi-project
        run: |
          python -m flask --app application db upgrade
          python scripts/seed_integration_data.py

      - name: Start FARBI for local health check
        id: application
        working-directory: farbi-project
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_TRACKING_ID="" nohup gunicorn \
            --bind 127.0.0.1:8000 \
            --workers 2 \
            --threads 4 \
            --timeout 120 \
            application:app > "$RUNNER_TEMP/farbi-gunicorn.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/farbi-gunicorn.pid"
          for i in {1..80}; do
            curl -fsS -H "Host: 127.0.0.1:5000" http://127.0.0.1:8000/ >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/farbi-gunicorn.log"
          exit 1

      - name: Open fixed public tunnel
        id: tunnel
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://trapdoor.sh/install.sh | sh
          command -v trapdoor

          kill "$(cat "$RUNNER_TEMP/farbi-gunicorn.pid")" || true
          sleep 2
          FLASK_SERVER_NAME="localhost:8000" \
          MAIN_APP_DOMAINS="farbi-otler17.trapdoor.sh,localhost,127.0.0.1" \
          PUBLIC_AUTH_ORIGIN="$FARBI_FIXED_URL" \
          RUNNER_TRACKING_ID="" nohup gunicorn \
            --chdir farbi-project \
            --bind 127.0.0.1:8000 \
            --workers 2 \
            --threads 4 \
            --timeout 120 \
            application:app > "$RUNNER_TEMP/farbi-gunicorn.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/farbi-gunicorn.pid"

          RUNNER_TRACKING_ID="" nohup trapdoor 8000 farbi-otler17 \
            > "$RUNNER_TEMP/trapdoor.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/trapdoor.pid"

          printf '%s\n' "$FARBI_FIXED_URL" | tee "$RUNNER_TEMP/farbi-live-url.txt"
          echo "FARBI_TUNNEL_URL=$FARBI_FIXED_URL" >> "$GITHUB_ENV"

          for i in {1..80}; do
            if curl -fsS --max-time 20 "$FARBI_FIXED_URL/" >/dev/null && \
               curl -fsS --max-time 20 "$FARBI_FIXED_URL/signin" >/dev/null && \
               curl -fsS --max-time 20 "$FARBI_FIXED_URL/signup" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/trapdoor.log" || true
          cat "$RUNNER_TEMP/farbi-gunicorn.log" || true
          exit 1

      - name: Verify signup and sign in against PostgreSQL
        id: auth_e2e
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN="$FARBI_FIXED_URL"
          USERNAME="hoste2e${GITHUB_RUN_ID}"
          EMAIL="hoste2e-${GITHUB_RUN_ID}@example.com"
          PASSWORD="FarbiHostTest-${GITHUB_RUN_ID}!"

          curl -fsS -c "$RUNNER_TEMP/register.cookies" "$ORIGIN/signup" -o "$RUNNER_TEMP/signup.html"
          TOKEN=$(grep -o 'name="csrf_token" value="[^"]*"' "$RUNNER_TEMP/signup.html" | head -1 | sed 's/.*value="//;s/"$//')
          test -n "$TOKEN"

          REGISTER_FINAL=$(curl -fsS -L -e "$ORIGIN/signup" \
            -b "$RUNNER_TEMP/register.cookies" -c "$RUNNER_TEMP/register.cookies" \
            -o "$RUNNER_TEMP/register-result.html" -w '%{url_effective}' \
            --data-urlencode "csrf_token=$TOKEN" \
            --data-urlencode "username=$USERNAME" \
            --data-urlencode "email=$EMAIL" \
            --data-urlencode "password=$PASSWORD" \
            --data-urlencode "confirm_password=$PASSWORD" \
            --data-urlencode "submit=Register" \
            "$ORIGIN/signup")
          test "$REGISTER_FINAL" = "$ORIGIN/"

          curl -fsS -c "$RUNNER_TEMP/login.cookies" "$ORIGIN/signin" -o "$RUNNER_TEMP/signin.html"
          TOKEN=$(grep -o 'name="csrf_token" value="[^"]*"' "$RUNNER_TEMP/signin.html" | head -1 | sed 's/.*value="//;s/"$//')
          test -n "$TOKEN"

          LOGIN_FINAL=$(curl -fsS -L -e "$ORIGIN/signin" \
            -b "$RUNNER_TEMP/login.cookies" -c "$RUNNER_TEMP/login.cookies" \
            -o "$RUNNER_TEMP/login-result.html" -w '%{url_effective}' \
            --data-urlencode "csrf_token=$TOKEN" \
            --data-urlencode "identifier=$EMAIL" \
            --data-urlencode "password=$PASSWORD" \
            --data-urlencode "submit=Login" \
            "$ORIGIN/signin")
          test "$LOGIN_FINAL" = "$ORIGIN/"
          echo "FARBI signup and sign in E2E passed."

      - name: Upload the fixed live URL
        uses: actions/upload-artifact@v4
        with:
          name: farbi-live-url
          path: ${{ runner.temp }}/farbi-live-url.txt
          if-no-files-found: error
          retention-days: 1

      - name: Publish current FARBI origin
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          payload = {
              "origin": os.environ["FARBI_FIXED_URL"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "commit": os.environ["GITHUB_SHA"],
              "published_at": datetime.now(timezone.utc).isoformat(),
              "auth_routes": {"signin": "/signin", "signup": "/signup"},
          }
          with open("farbi-live-origin.json", "w", encoding="utf-8") as handle:
              json.dump(payload, handle, indent=2)
              handle.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add farbi-live-origin.json
          git commit -m "Publish FARBI fixed live origin [skip ci]"
          git push origin HEAD:master

      - name: Publish launch status
        if: always()
        shell: bash
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          DATABASE_OUTCOME: ${{ steps.database.outcome }}
          APPLICATION_OUTCOME: ${{ steps.application.outcome }}
          TUNNEL_OUTCOME: ${{ steps.tunnel.outcome }}
          AUTH_E2E_OUTCOME: ${{ steps.auth_e2e.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          set -u
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "commit": os.environ["GITHUB_SHA"],
              "published_at": datetime.now(timezone.utc).isoformat(),
              "public_url": os.environ.get("FARBI_FIXED_URL"),
              "steps": {
                  "restore": os.environ.get("RESTORE_OUTCOME", "unknown"),
                  "dependencies": os.environ.get("DEPENDENCIES_OUTCOME", "unknown"),
                  "database": os.environ.get("DATABASE_OUTCOME", "unknown"),
                  "application": os.environ.get("APPLICATION_OUTCOME", "unknown"),
                  "tunnel": os.environ.get("TUNNEL_OUTCOME", "unknown"),
                  "auth_e2e": os.environ.get("AUTH_E2E_OUTCOME", "unknown"),
                  "publish": os.environ.get("PUBLISH_OUTCOME", "unknown"),
              },
          }
          for name in ("farbi-gunicorn.log", "trapdoor.log"):
              path = Path(os.environ["RUNNER_TEMP"]) / name
              if path.exists():
                  payload[name] = path.read_text(encoding="utf-8", errors="replace")[-8000:]
          Path("farbi-launch-status.json").write_text(
              json.dumps(payload, indent=2) + "\n", encoding="utf-8"
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add farbi-launch-status.json
          git commit -m "Publish FARBI launch status [skip ci]" || true
          git pull --rebase origin master || true
          git push origin HEAD:master || true

      - name: Keep FARBI online
        shell: bash
        run: |
          set -euo pipefail
          echo "FARBI is live at $FARBI_FIXED_URL"
          for i in {1..66}; do
            curl -fsS --max-time 20 "$FARBI_FIXED_URL/" >/dev/null
            curl -fsS --max-time 20 "$FARBI_FIXED_URL/signin" >/dev/null
            curl -fsS --max-time 20 "$FARBI_FIXED_URL/signup" >/dev/null
            echo "heartbeat $i — $FARBI_FIXED_URL"
            sleep 300
          done
