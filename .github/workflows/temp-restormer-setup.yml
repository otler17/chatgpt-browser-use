name: Temporary Restormer setup

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-restormer-setup.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download official Restormer source and motion-deblurring checkpoint
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o restormer.zip \
            https://github.com/swz30/Restormer/archive/refs/tags/v1.0.zip
          unzip -q restormer.zip
          mv Restormer-1.0 Restormer
          mkdir -p Restormer/Motion_Deblurring/pretrained_models
          curl -fL --retry 3 -o Restormer/Motion_Deblurring/pretrained_models/motion_deblurring.pth \
            https://github.com/swz30/Restormer/releases/download/v1.0/motion_deblurring.pth
          test -s Restormer/Motion_Deblurring/pretrained_models/motion_deblurring.pth
          sha256sum Restormer/Motion_Deblurring/pretrained_models/motion_deblurring.pth | tee Restormer/Motion_Deblurring/pretrained_models/motion_deblurring.pth.sha256
          du -sh Restormer

      - name: Upload Restormer bundle
        uses: actions/upload-artifact@v4
        with:
          name: restormer-motion-deblur
          path: Restormer
          if-no-files-found: error
          retention-days: 1
