name: Temporary supercar video download

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-supercar-download.yml'

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install current yt-dlp nightly
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp -o yt-dlp
          chmod +x yt-dlp
          ./yt-dlp --version

      - name: Download a public supercar video
        shell: bash
        run: |
          set -euxo pipefail
          urls=(
            'https://www.youtube.com/watch?v=KidzSnnCJKU'
          )
          clients=(
            'tv_simply'
            'tv'
            'web_embedded'
            'ios'
            'mweb'
            'visionos'
          )
          rm -f source.mp4 source_url.txt source_title.txt
          for url in "${urls[@]}"; do
            for client in "${clients[@]}"; do
              echo "Trying player client: $client"
              rm -f source.mp4 source.mp4.part title.tmp
              if ./yt-dlp \
                --no-playlist \
                --retries 3 \
                --fragment-retries 3 \
                --js-runtimes node \
                --remote-components ejs:github \
                --extractor-args "youtube:player_client=${client}" \
                -f '18/b[ext=mp4][height<=480]/b[height<=720]' \
                -o source.mp4 \
                --print-to-file '%(title)s' title.tmp \
                "$url"; then
                if [ -s source.mp4 ]; then
                  cp title.tmp source_title.txt
                  echo "$url" > source_url.txt
                  break 2
                fi
              fi
            done
          done
          test -s source.mp4
          test -s source_url.txt
          ls -lh source.mp4 source_url.txt source_title.txt

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: supercar-source
          path: |
            source.mp4
            source_url.txt
            source_title.txt
          if-no-files-found: error
          retention-days: 1
