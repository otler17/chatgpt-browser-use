name: Temporary supercar video download

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-supercar-download.yml'

permissions:
  contents: read

jobs:
  download-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download archived YouTube supercar MP4
        shell: bash
        run: |
          set -euxo pipefail
          MEDIA='https://archive.ventilaar.net/videos/automatic/UCTGrgT-Ld4kH3CxHnCMGn8w/LUH2PFUROYA/when-honda-took-on-ferrari-and-won.mp4'
          curl -L --fail --retry 5 --retry-all-errors -A 'Mozilla/5.0' "$MEDIA" -o source.mp4
          test -s source.mp4
          echo 'When Honda took on Ferrari and WON!' > source_title.txt
          echo 'https://www.youtube.com/watch?v=LUH2PFUROYA' > source_url.txt
          ls -lh source.mp4 source_title.txt source_url.txt

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: supercar-source
          path: |
            source.mp4
            source_url.txt
            source_title.txt
          if-no-files-found: error
          retention-days: 1
