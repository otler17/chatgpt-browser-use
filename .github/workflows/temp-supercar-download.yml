name: Temporary supercar video download

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-supercar-download.yml'

permissions:
  contents: read

jobs:
  inspect-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect archived YouTube supercar page
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 4 -A 'Mozilla/5.0' \
            'https://archive.ventilaar.net/watch?v=LUH2PFUROYA' \
            -o page.html
          wc -c page.html
          grep -Eio '.{0,160}(mp4|webm|video|source|download|LUH2PFUROYA).{0,240}' page.html | head -n 120 || true
