name: Patch FARBI verified demo

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/farbi-fix-trapdoor.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Patch host workflow
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/patch_farbi.py
          python /tmp/patch_farbi.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/farbi-live-host.yml
          git commit -m "Seed and verify FARBI demo accounts and pages"
          git push origin HEAD:master
