name: Temporary F5-TTS minimal dependency patch

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-supercar-download.yml'

permissions:
  contents: read

jobs:
  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build missing dependency wheels
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p f5_dep_patch
          python -m pip install -U pip wheel setuptools
          python -m pip wheel --wheel-dir f5_dep_patch --no-deps \
            'torch-einops-utils>=0.1.12' 'encodec==0.1.1' \
            'frozendict' 'hyper-connections>=0.1.8'
          ls -lh f5_dep_patch
      - name: Upload dependency patch
        uses: actions/upload-artifact@v4
        with:
          name: f5-minimal-dep-patch
          path: f5_dep_patch
          if-no-files-found: error
          retention-days: 1
