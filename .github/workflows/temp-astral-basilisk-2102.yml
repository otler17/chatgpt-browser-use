name: Temporary ASTRAL Basilisk 2.10.2 bundle

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-astral-basilisk-2102.yml'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Publish run id
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = '.github/astral-basilisk-run.txt';
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner, repo, path});
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const content = Buffer.from(`${context.runId}\n`).toString('base64');
            await github.rest.repos.createOrUpdateFileContents({owner, repo, path, sha, content, message: `Record ASTRAL Basilisk run ${context.runId}`});
      - name: Download Basilisk runtime wheel
        shell: bash
        run: |
          set -euxo pipefail
          mkdir wheels
          python -m pip install -U pip
          python -m pip download --only-binary=:all: --dest wheels 'bsk==2.10.2'
          ls -lh wheels
          tar -czf astral-basilisk-2102-py313-linux.tar.gz wheels
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: astral-basilisk-2102-py313-linux
          path: astral-basilisk-2102-py313-linux.tar.gz
          retention-days: 1
