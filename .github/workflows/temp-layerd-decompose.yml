name: Temporary LayerD decomposition

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-layerd-decompose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompose:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild and verify input image
        shell: bash
        run: |
          set -euxo pipefail
          cat \
            tmp/layerd-20260827/input_00.b64 \
            tmp/layerd-20260827/input_01a.b64 \
            tmp/layerd-20260827/input_01b1.b64 \
            tmp/layerd-20260827/input_01b2.b64 \
            tmp/layerd-20260827/input_01b3.b64 \
            tmp/layerd-20260827/input_01b4.b64 \
            tmp/layerd-20260827/input_01c.b64 \
            tmp/layerd-20260827/input_02a.b64 \
            tmp/layerd-20260827/input_02b.b64 \
            tmp/layerd-20260827/input_02c.b64 \
            tmp/layerd-20260827/input_03.b64 \
            tmp/layerd-20260827/input_04.b64 \
            tmp/layerd-20260827/input_05.b64 \
            | base64 -d > input.png
          file input.png
          echo '1abb722c91e5cde39119026c07b44d6d3129447062e1cd0b8f877d342a836700  input.png' | sha256sum -c -
          ls -lh input.png

      - name: Install LayerD
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'git+https://github.com/CyberAgentAILab/LayerD.git'

      - name: Decompose with LayerD
        shell: bash
        run: |
          set -euxo pipefail
          cat > run_layerd.py <<'PY'
          import json
          import os
          from PIL import Image
          from layerd import LayerDPipeline

          out = 'layerd-output'
          os.makedirs(f'{out}/layers', exist_ok=True)
          os.makedirs(f'{out}/elements', exist_ok=True)

          image = Image.open('input.png').convert('RGBA')
          print('input', image.size, image.mode)

          pipeline = LayerDPipeline(device='cpu')
          result = pipeline(image, max_iterations=3)

          result.save(f'{out}/output.svg')
          result.save(f'{out}/output.psd')

          for i, layer in enumerate(result.layers):
              layer.save(f'{out}/layers/layer_{i:02d}.png')

          manifest = []
          for elem in result.elements:
              eid = int(elem['id'])
              etype = str(elem['type'])
              elem['image'].save(f'{out}/elements/element_{eid:03d}_{etype}.png')
              manifest.append({
                  'id': eid,
                  'type': etype,
                  'box': {k: int(v) for k, v in dict(elem['box']).items()},
              })

          with open(f'{out}/manifest.json', 'w', encoding='utf-8') as f:
              json.dump({
                  'canvas_size': [int(x) for x in result.canvas_size],
                  'layer_count': len(result.layers),
                  'element_count': len(result.elements),
                  'elements': manifest,
              }, f, ensure_ascii=False, indent=2)

          image.save(f'{out}/input-proxy.png')
          print('layers', len(result.layers))
          print('elements', len(result.elements))
          PY
          python run_layerd.py

      - name: Package outputs
        shell: bash
        run: |
          set -euxo pipefail
          zip -r layerd-decomposition.zip layerd-output
          find layerd-output -maxdepth 2 -type f -printf '%p %k KB\n' | sort
          ls -lh layerd-decomposition.zip

      - name: Upload decomposition artifact
        uses: actions/upload-artifact@v4
        with:
          name: layerd-decomposition-20260827
          path: |
            layerd-output
            layerd-decomposition.zip
          if-no-files-found: error
          retention-days: 1
