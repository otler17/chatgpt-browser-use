name: Temporary YouTube browser-token test

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-supercar-download.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install downloader and browser token provider
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --user -U --pre 'yt-dlp[default]' yt-dlp-getpot-wpc
          chromium --version || google-chrome --version || true
          python3 -m yt_dlp --version
      - name: Probe requested public video
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m yt_dlp -v --skip-download --extractor-args 'youtube:player_client=mweb;youtubepot-wpc:browser_path=/usr/bin/chromium' 'https://www.youtube.com/watch?v=PtdI0KZRTLU'
