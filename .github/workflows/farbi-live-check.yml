name: FARBI live endpoint verification

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/farbi-live-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify remapped public auth pages
        shell: bash
        run: |
          set -euo pipefail
          STABLE="https://farbi-marketplace.omar-gassab.chatgpt.site"

          check() {
            local path="$1"
            local result
            result=$(curl -fsSL \
              --max-time 30 \
              --max-redirs 3 \
              -o /tmp/farbi-page.html \
              -w '%{http_code} %{num_redirects} %{url_effective}' \
              "$STABLE$path")
            echo "$path -> $result"
            test "$(awk '{print $1}' <<< "$result")" = "200"
            test "$(awk '{print $2}' <<< "$result")" = "0"
            grep -qi '<form' /tmp/farbi-page.html
          }

          curl -fsS "$STABLE/" >/dev/null
          check /signin
          check /signup
