name: Temporary YouTube exact download

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-supercar-download.yml'

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Start Cloudflare WARP proxy
        shell: bash
        run: |
          set -euxo pipefail
          docker network create warp-net || true
          docker run -d --name warp --network warp-net -p 1080:1080 --cap-add NET_ADMIN --sysctl net.ipv6.conf.all.disable_ipv6=0 --sysctl net.ipv4.conf.all.src_valid_mark=1 caomingjun/warp
          for i in {1..20}; do
            RESULT=$(curl -s --max-time 4 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace || true)
            echo "$RESULT"
            echo "$RESULT" | grep -qE 'warp=(on|plus)' && exit 0
            sleep 2
          done
          exit 1

      - name: Install yt-dlp and Deno
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --user -U --pre 'yt-dlp[default]'
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Download exact requested video
        shell: bash
        run: |
          set -euxo pipefail
          deno --version
          python3 -m yt_dlp --proxy 'socks5://127.0.0.1:1080' --remote-components ejs:github --js-runtimes deno --extractor-args 'youtube:player_client=web_embedded' --no-playlist -f 18 -o 'PtdI0KZRTLU.%(ext)s' 'https://www.youtube.com/watch?v=PtdI0KZRTLU'
          test -s PtdI0KZRTLU.mp4
          ls -lh PtdI0KZRTLU.mp4

      - name: Upload exact video artifact
        uses: actions/upload-artifact@v4
        with:
          name: PtdI0KZRTLU-video
          path: PtdI0KZRTLU.mp4
          if-no-files-found: error
          retention-days: 1
