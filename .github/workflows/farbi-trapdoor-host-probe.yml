name: Detect Trapdoor upstream Host

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/farbi-trapdoor-host-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Report forwarded proxy headers
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/hostserver.py <<'PY'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def do_GET(self):
                  keys = ["Host", "X-Forwarded-Host", "X-Forwarded-Proto", "X-Forwarded-Port", "Forwarded", "X-Real-IP"]
                  lines = [f"{key}={self.headers.get(key, '')}" for key in keys]
                  lines.append("PATH=" + self.path)
                  body=("\n".join(lines) + "\n").encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "text/plain")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *args):
                  pass
          HTTPServer(("127.0.0.1", 8080), H).serve_forever()
          PY
          python3 /tmp/hostserver.py &
          curl -fsSL https://trapdoor.sh/install.sh | sh
          trapdoor 8080 farbi-headerprobe-otler17 >/tmp/trapdoor.log 2>&1 &
          for i in {1..30}; do
            if RESULT=$(curl -fsS --max-time 10 https://farbi-headerprobe-otler17.trapdoor.sh/test 2>/dev/null); then
              echo "$RESULT"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/trapdoor.log
          exit 1
