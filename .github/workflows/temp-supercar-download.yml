name: Temporary VibeThinker sandbox bundle

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-supercar-download.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch official llama.cpp Ubuntu x64 CPU runtime
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p vibethinker_bundle/llama_cpp
          curl -L --fail --retry 5 --retry-delay 2 \
            -o /tmp/llama.tar.gz \
            'https://github.com/ggml-org/llama.cpp/releases/download/b10453/llama-b10453-bin-ubuntu-x64.tar.gz'
          tar -xzf /tmp/llama.tar.gz -C vibethinker_bundle/llama_cpp
          CLI=$(find vibethinker_bundle/llama_cpp -type f -name llama-cli | head -n 1)
          test -n "$CLI"
          chmod +x "$CLI"
          LD_LIBRARY_PATH="$(dirname "$CLI"):${LD_LIBRARY_PATH:-}" "$CLI" --version
          find vibethinker_bundle/llama_cpp -maxdepth 2 -type f -printf '%p %k KB\n' | head -80

      - name: Download VibeThinker-3B Q3_K_M GGUF
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 --retry-delay 3 \
            -o vibethinker_bundle/VibeThinker-3B.Q3_K_M.gguf \
            'https://huggingface.co/prithivMLmods/VibeThinker-3B-GGUF/resolve/main/VibeThinker-3B.Q3_K_M.gguf?download=true'
          ls -lh vibethinker_bundle/VibeThinker-3B.Q3_K_M.gguf
          sha256sum vibethinker_bundle/VibeThinker-3B.Q3_K_M.gguf | tee vibethinker_bundle/SHA256SUMS.txt

      - name: Upload sandbox bundle
        uses: actions/upload-artifact@v4
        with:
          name: vibethinker-3b-q3km-sandbox
          path: vibethinker_bundle
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
