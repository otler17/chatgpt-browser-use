name: Temporary F5-TTS dependency patch

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-supercar-download.yml'

permissions:
  contents: read

jobs:
  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download dependency patch wheels
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p f5_dep_patch
          python -m pip install -U pip
          python -m pip download --dest f5_dep_patch --only-binary=:all: --no-deps \
            'tokenizers==0.23.0rc0' 'torch-einops-utils>=0.1.12' 'encodec==0.1.1' \
            'frozendict' 'hyper-connections>=0.1.8' 'safetensors>=0.8.0'
          ls -lh f5_dep_patch
      - name: Upload dependency patch
        uses: actions/upload-artifact@v4
        with:
          name: f5-dep-patch
          path: f5_dep_patch
          retention-days: 1
