name: Temporary supercar video download

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-supercar-download.yml'

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install current yt-dlp
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 5 https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o yt-dlp
          chmod +x yt-dlp
          ./yt-dlp --version
          ffmpeg -version | head -n 1

      - name: Download a supercar video
        shell: bash
        run: |
          set -euxo pipefail
          urls=(
            'https://www.youtube.com/watch?v=fMqTRIhfJXk'
            'https://www.youtube.com/watch?v=C74Hq3HVD0Y'
            'https://www.youtube.com/watch?v=KidzSnnCJKU'
          )
          rm -f source.mp4 source_url.txt source_title.txt
          for url in "${urls[@]}"; do
            rm -f source.mp4 source.mp4.part source.webm source.mkv
            if ./yt-dlp \
              --no-playlist \
              --retries 5 \
              --fragment-retries 5 \
              --js-runtimes node \
              --remote-components ejs:github \
              -f 'bv*[height<=720]+ba/b[height<=720]' \
              --merge-output-format mp4 \
              -o 'source.%(ext)s' \
              --print-to-file '%(title)s' source_title.txt \
              "$url"; then
              candidate=$(find . -maxdepth 1 -type f \( -name 'source.mp4' -o -name 'source.webm' -o -name 'source.mkv' \) | head -n 1)
              if [ -n "$candidate" ] && [ -s "$candidate" ]; then
                if [ "$candidate" != './source.mp4' ]; then
                  ffmpeg -y -i "$candidate" -c copy source.mp4 || ffmpeg -y -i "$candidate" -c:v libx264 -preset veryfast -crf 23 -c:a aac source.mp4
                fi
                echo "$url" > source_url.txt
                break
              fi
            fi
          done
          test -s source.mp4
          test -s source_url.txt
          ls -lh source.mp4 source_url.txt source_title.txt

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: supercar-source
          path: |
            source.mp4
            source_url.txt
            source_title.txt
          if-no-files-found: error
          retention-days: 1
