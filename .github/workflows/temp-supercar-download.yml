name: Temporary WMM2025 coefficient download

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-supercar-download.yml'

permissions:
  contents: read
  actions: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download official NOAA WMM2025 coefficients
        shell: bash
        run: |
          set -euxo pipefail
          curl -fL --retry 3 \
            'https://www.ncei.noaa.gov/sites/default/files/2024-12/WMM2025COF.zip' \
            -o WMM2025COF.zip
          unzip -o WMM2025COF.zip -d wmm2025
          find wmm2025 -maxdepth 2 -type f -print
          COF=$(find wmm2025 -type f -iname 'WMM.COF' | head -n 1)
          test -n "$COF"
          cp "$COF" WMM.COF
          head -n 1 WMM.COF
          grep -Eq '^ *2025\.0 +WMM-2025 +11/13/2024' WMM.COF
          test "$(wc -l < WMM.COF)" -eq 93
          sha256sum WMM.COF WMM2025COF.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload WMM2025 files
        uses: actions/upload-artifact@v4
        with:
          name: wmm2025-coefficients
          path: |
            WMM.COF
            WMM2025COF.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
