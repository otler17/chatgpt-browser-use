name: Temporary NAFNet RealESRGAN setup

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-supercar-download.yml'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/temp-supercar-download.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download restoration model weights
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --upgrade gdown
          mkdir -p nafnet_bundle/experiments/pretrained_models
          gdown 1S0PVRbyTakYY9a82kujgZLbMihfNBLfC -O nafnet_bundle/experiments/pretrained_models/NAFNet-GoPro-width64.pth
          mkdir -p realesrgan_bundle/weights
          wget -q 'https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth' -O realesrgan_bundle/weights/RealESRGAN_x4plus.pth
          sha256sum nafnet_bundle/experiments/pretrained_models/NAFNet-GoPro-width64.pth realesrgan_bundle/weights/RealESRGAN_x4plus.pth
          test "$(sha256sum nafnet_bundle/experiments/pretrained_models/NAFNet-GoPro-width64.pth | awk '{print $1}')" = '329d3ab4077b8d6b7ff61de376e483714667960bf85be027bf4335cda701196f'
          test "$(sha256sum realesrgan_bundle/weights/RealESRGAN_x4plus.pth | awk '{print $1}')" = '4fa0d38905f75ac06eb49a7951b426670021be3018265fd191d2125df9d682f1'

      - name: Upload restoration bundle
        uses: actions/upload-artifact@v4
        with:
          name: nafnet-esrgan-bundle
          path: |
            nafnet_bundle
            realesrgan_bundle
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
