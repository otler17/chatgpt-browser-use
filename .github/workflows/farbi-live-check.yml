name: FARBI live endpoint verification

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/farbi-live-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out published origin
        uses: actions/checkout@v4

      - name: Compare stable and current backend auth links
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN=$(python -c 'import json; print(json.load(open("farbi-live-origin.json"))["origin"])')
          STABLE="https://farbi-marketplace.omar-gassab.chatgpt.site"

          for BASE in "$ORIGIN" "$STABLE"; do
            echo "=== $BASE ==="
            curl -fsS "$BASE/" -o /tmp/home.html
            grep -Eo 'href="[^"]*(login|signin|register|signup)[^"]*"' /tmp/home.html | sort -u || true
            for ROUTE in /signin /signup; do
              curl -sS -o /dev/null -w "$ROUTE status=%{http_code} redirects=%{num_redirects}\n" --max-redirs 0 "$BASE$ROUTE" || true
            done
          done
