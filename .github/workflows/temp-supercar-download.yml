name: Temporary YouTube transcript fetch

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-supercar-download.yml'

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Start Cloudflare WARP proxy
        shell: bash
        run: |
          set -euxo pipefail
          docker network create warp-net || true
          docker run -d --name warp --network warp-net -p 1080:1080 --cap-add NET_ADMIN --sysctl net.ipv6.conf.all.disable_ipv6=0 --sysctl net.ipv4.conf.all.src_valid_mark=1 caomingjun/warp
          for i in {1..20}; do
            RESULT=$(curl -s --max-time 4 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace || true)
            echo "$RESULT"
            echo "$RESULT" | grep -qE 'warp=(on|plus)' && exit 0
            sleep 2
          done
          exit 1

      - name: Install yt-dlp and Deno
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --user -U --pre 'yt-dlp[default]'
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Fetch metadata and subtitles
        shell: bash
        run: |
          set -euxo pipefail
          deno --version
          python3 -m yt_dlp \
            --proxy 'socks5://127.0.0.1:1080' \
            --remote-components ejs:github \
            --js-runtimes deno \
            --extractor-args 'youtube:player_client=web_embedded' \
            --no-playlist \
            --skip-download \
            --write-info-json \
            --write-auto-subs \
            --sub-langs 'en.*' \
            --sub-format vtt \
            -o 'prtlfPqQ-FI.%(ext)s' \
            'https://www.youtube.com/watch?v=prtlfPqQ-FI'
          ls -lh prtlfPqQ-FI.*

      - name: Upload transcript artifact
        uses: actions/upload-artifact@v4
        with:
          name: prtlfPqQ-FI-transcript
          path: prtlfPqQ-FI.*
          if-no-files-found: error
          retention-days: 1
