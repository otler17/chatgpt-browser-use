name: Temporary ASTRAL Basilisk 2.10.2 bundle

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-astral-basilisk-2102.yml'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Publish run id
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = '.github/astral-basilisk-run.txt';
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner, repo, path});
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const content = Buffer.from(`${context.runId}\n`).toString('base64');
            await github.rest.repos.createOrUpdateFileContents({owner, repo, path, sha, content, message: `Record ASTRAL Basilisk run ${context.runId}`});
      - name: Fetch verified Basilisk wheel
        shell: bash
        run: |
          set -euxo pipefail
          mkdir wheels
          curl -fL --retry 3 -o wheels/bsk-2.10.2-cp39-abi3-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl \
            'https://files.pythonhosted.org/packages/b8/ce/79ddd29269c186a870fc19ebd24390701921d20a8242345df4c061a94ca7/bsk-2.10.2-cp39-abi3-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl'
          echo 'a3a536eb45addd5c96769015765b0d66c4e0183af9c9e95020fa1cc5dedbbcbe  wheels/bsk-2.10.2-cp39-abi3-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl' | sha256sum -c -
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: astral-basilisk-2102-py313-linux
          path: wheels/bsk-2.10.2-cp39-abi3-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl
          retention-days: 1
