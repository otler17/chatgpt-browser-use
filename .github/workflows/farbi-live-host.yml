name: FARBI verified auth host

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/farbi-live-host.yml"
      - ".github/farbi-bundle/**"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  farbi:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: farbi_user
          POSTGRES_PASSWORD: farbi_password
          POSTGRES_DB: farbi_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U farbi_user -d farbi_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: development
      SECRET_KEY: farbi-demo-fixed-secret-20260816
      DATABASE_URL: postgresql://farbi_user:farbi_password@127.0.0.1:5432/farbi_db
      REDIS_URL: redis://127.0.0.1:6379/0
      PAYMENT_WEBHOOK_SECRET: farbi-demo-webhook
      OFFLINE_LOCAL_MODE: "true"
      STORAGE_BACKEND: local
      LOCAL_UPLOAD_ROOT: instance/local_uploads
      EMAIL_BACKEND: local
      LOCAL_EMAIL_OUTBOX: instance/offline_emails
      PAYMENT_PROVIDER: mock
      MAIN_APP_DOMAINS: farbi-otler17.trapdoor.sh,localhost,127.0.0.1
      PUBLIC_AUTH_ORIGIN: https://farbi-otler17.trapdoor.sh
      FARBI_FIXED_URL: https://farbi-otler17.trapdoor.sh

    steps:
      - name: Check out runtime bundle
        uses: actions/checkout@v4

      - name: Restore exact FARBI project
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          OIDC_JSON=$(curl -fsS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=farbi-sites-bootstrap")
          OIDC_TOKEN=$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$OIDC_JSON")
          FARBI_BUNDLE_KEY=$(curl -fsS \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            https://farbi-marketplace.omar-gassab.chatgpt.site/.well-known/farbi-bundle-key)
          export FARBI_BUNDLE_KEY
          cat .github/farbi-bundle/*.enc | openssl enc -d -aes-256-cbc -pbkdf2 \
            -pass env:FARBI_BUNDLE_KEY -out farbi-project.zip
          mkdir farbi-project
          unzip -q farbi-project.zip -d farbi-project
          test -f farbi-project/application.py
          test -f farbi-project/scripts/seed_integration_data.py

      - name: Adapt auth routes for fixed demo host
        working-directory: farbi-project
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("application.py")
          s = p.read_text(encoding="utf-8")
          old = "def require_platform_host_for_auth():\n    if request.endpoint not in SENSITIVE_AUTH_ENDPOINTS:\n        return None"
          new = "def require_platform_host_for_auth():\n    if current_app.config.get('OFFLINE_LOCAL_MODE'):\n        return None\n    if request.endpoint not in SENSITIVE_AUTH_ENDPOINTS:\n        return None"
          if old in s:
              s = s.replace(old, new, 1)
          register = "@app.route('/register', methods=['GET', 'POST'])"
          login = "@app.route('/login', methods=['GET', 'POST'])"
          if register not in s or login not in s:
              raise SystemExit("Expected auth route decorators not found")
          s = s.replace(register, "@app.route('/signup', methods=['GET', 'POST'])", 1)
          s = s.replace(login, "@app.route('/signin', methods=['GET', 'POST'])", 1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: farbi-project/requirements/prod.txt

      - name: Install application dependencies
        id: dependencies
        working-directory: farbi-project
        run: python -m pip install -r requirements/prod.txt

      - name: Migrate and seed PostgreSQL
        id: database
        working-directory: farbi-project
        run: |
          set -euo pipefail
          python -m flask --app application db upgrade
          python scripts/seed_integration_data.py

      - name: Start fixed public FARBI host
        id: tunnel
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://trapdoor.sh/install.sh | sh

          cat > farbi-project/trapdoor_entry.py <<'PY'
          from application import app

          PUBLIC_HOST = "farbi-otler17.trapdoor.sh"
          INTERNAL_HOST = "localhost:8000"

          class TrapdoorPublicHost:
              def __init__(self, wrapped):
                  self.wrapped = wrapped

              def __call__(self, environ, start_response):
                  if environ.get("HTTP_HOST", "").lower() == INTERNAL_HOST:
                      environ["HTTP_HOST"] = PUBLIC_HOST
                      environ["SERVER_NAME"] = PUBLIC_HOST
                      environ["SERVER_PORT"] = "443"
                      environ["wsgi.url_scheme"] = "https"
                  return self.wrapped(environ, start_response)

          app.config["PREFERRED_URL_SCHEME"] = "https"
          app.wsgi_app = TrapdoorPublicHost(app.wsgi_app)
          PY

          FLASK_SERVER_NAME="farbi-otler17.trapdoor.sh" \
          MAIN_APP_DOMAINS="farbi-otler17.trapdoor.sh,localhost,127.0.0.1" \
          PUBLIC_AUTH_ORIGIN="$FARBI_FIXED_URL" \
          RUNNER_TRACKING_ID="" nohup gunicorn \
            --chdir farbi-project \
            --bind 127.0.0.1:8000 \
            --workers 2 \
            --threads 4 \
            --timeout 120 \
            trapdoor_entry:app > "$RUNNER_TEMP/farbi-gunicorn.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/farbi-gunicorn.pid"

          RUNNER_TRACKING_ID="" nohup trapdoor 8000 farbi-otler17 \
            > "$RUNNER_TEMP/trapdoor.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/trapdoor.pid"

          for i in {1..90}; do
            if curl -fsS --max-time 20 "$FARBI_FIXED_URL/" >/dev/null && \
               curl -fsS --max-time 20 "$FARBI_FIXED_URL/signin" >/dev/null && \
               curl -fsS --max-time 20 "$FARBI_FIXED_URL/signup" >/dev/null; then
              echo "FARBI public pages are reachable."
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/trapdoor.log" || true
          cat "$RUNNER_TEMP/farbi-gunicorn.log" || true
          exit 1

      - name: Verify signup, PostgreSQL, session and fresh signin
        id: auth_e2e
        working-directory: farbi-project
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import sys
          import requests
          from bs4 import BeautifulSoup
          from application import app, User

          origin = os.environ["FARBI_FIXED_URL"].rstrip("/")
          run_id = os.environ["GITHUB_RUN_ID"]
          username = f"demo{run_id}"
          email = f"farbi.demo.{run_id}@gmail.com"
          password = f"FarbiDemo-{run_id}!"

          def hidden_fields(html):
              soup = BeautifulSoup(html, "html.parser")
              form = soup.find("form")
              if form is None:
                  raise AssertionError("No form found")
              fields = []
              for node in form.find_all("input"):
                  if node.get("type", "text").lower() == "hidden" and node.get("name"):
                      fields.append((node["name"], node.get("value", "")))
              return fields

          def print_form_errors(html, label):
              soup = BeautifulSoup(html, "html.parser")
              messages = []
              form = soup.find("form")
              if form:
                  for node in form.select("span.text-red-500"):
                      text = node.get_text(" ", strip=True)
                      if text:
                          messages.append(text)
              for selector in (".alert", "[role=alert]", ".flash-message"):
                  for node in soup.select(selector):
                      text = node.get_text(" ", strip=True)
                      if text and text not in messages:
                          messages.append(text)
              print(f"{label} messages: {messages}")

          signup = requests.Session()
          r = signup.get(origin + "/signup", timeout=30)
          r.raise_for_status()
          payload = hidden_fields(r.text)
          payload.extend([
              ("username", username),
              ("email", email),
              ("password", password),
              ("confirm_password", password),
              ("submit", "Register"),
          ])
          r = signup.post(
              origin + "/signup",
              data=payload,
              headers={"Referer": origin + "/signup"},
              allow_redirects=False,
              timeout=30,
          )
          print("signup status:", r.status_code, "location:", r.headers.get("Location"))
          if r.status_code not in (302, 303):
              print_form_errors(r.text, "signup")
              sys.exit(1)

          with app.app_context():
              user = User.query.filter_by(email=email).one_or_none()
              assert user is not None, "registered user missing from PostgreSQL"
              assert user.check_password(password), "password hash verification failed"
              print({"postgres_user_id": user.id, "email": user.email})

          r = signup.get(origin + "/profile/edit", allow_redirects=False, timeout=30)
          print("protected profile after signup:", r.status_code)
          assert r.status_code == 200, "signup session did not authenticate protected route"

          signin = requests.Session()
          r = signin.get(origin + "/signin", timeout=30)
          r.raise_for_status()
          payload = hidden_fields(r.text)
          payload.extend([
              ("identifier", email),
              ("password", password),
              ("submit", "Login"),
          ])
          r = signin.post(
              origin + "/signin",
              data=payload,
              headers={"Referer": origin + "/signin"},
              allow_redirects=False,
              timeout=30,
          )
          print("fresh signin status:", r.status_code, "location:", r.headers.get("Location"))
          if r.status_code not in (302, 303):
              print_form_errors(r.text, "signin")
              sys.exit(1)

          r = signin.get(origin + "/profile/edit", allow_redirects=False, timeout=30)
          print("protected profile after fresh signin:", r.status_code)
          assert r.status_code == 200, "fresh signin did not authenticate protected route"
          print("FARBI AUTH E2E PASSED")
          PY

      - name: Publish verified live origin
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          payload = {
              "origin": os.environ["FARBI_FIXED_URL"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "published_at": datetime.now(timezone.utc).isoformat(),
              "auth_routes": {"signin": "/signin", "signup": "/signup"},
              "postgres_auth_e2e": "passed"
          }
          with open("farbi-live-origin.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add farbi-live-origin.json
          git commit -m "Publish verified FARBI auth origin [skip ci]" || true
          git pull --rebase origin master || true
          git push origin HEAD:master || true

      - name: Keep verified FARBI online
        shell: bash
        run: |
          set -euo pipefail
          echo "FARBI LIVE: $FARBI_FIXED_URL"
          for i in {1..66}; do
            curl -fsS --max-time 20 "$FARBI_FIXED_URL/" >/dev/null
            curl -fsS --max-time 20 "$FARBI_FIXED_URL/signin" >/dev/null
            curl -fsS --max-time 20 "$FARBI_FIXED_URL/signup" >/dev/null
            echo "heartbeat $i"
            sleep 300
          done
