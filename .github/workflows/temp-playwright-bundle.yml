name: Temporary Playwright bundle

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-playwright-bundle.yml'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build portable Playwright bundle
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p playwright-bundle/wheels playwright-bundle/ms-playwright
          python -m pip install -U pip
          python -m pip download --only-binary=:all: --dest playwright-bundle/wheels 'playwright==1.61.0' pytest
          python -m pip install 'playwright==1.61.0'
          PLAYWRIGHT_BROWSERS_PATH="$PWD/playwright-bundle/ms-playwright" python -m playwright install chromium
          python - <<'PY'
          from pathlib import Path
          roots = list(Path('playwright-bundle/ms-playwright').glob('chromium-*'))
          assert roots, 'Chromium download missing'
          print('Chromium roots:', *roots, sep='\n')
          PY
          du -sh playwright-bundle
          tar -czf playwright-bundle.tar.gz playwright-bundle
          ls -lh playwright-bundle.tar.gz

      - name: Upload compressed Playwright bundle
        uses: actions/upload-artifact@v4
        with:
          name: playwright-1.61.0-python313-chromium-linux-tgz
          path: playwright-bundle.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Publish run id
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = '.github/playwright-bundle-run.txt';
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner, repo, path});
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const content = Buffer.from(`${context.runId}\n`).toString('base64');
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path, sha, content,
              message: `Record Playwright bundle run ${context.runId}`
            });
