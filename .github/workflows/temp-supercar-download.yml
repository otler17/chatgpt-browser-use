name: Temporary YouTube WARP test

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-supercar-download.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Start Cloudflare WARP proxy
        shell: bash
        run: |
          set -euxo pipefail
          docker network create warp-net || true
          docker run -d --name warp --network warp-net -p 1080:1080 --cap-add NET_ADMIN --sysctl net.ipv6.conf.all.disable_ipv6=0 --sysctl net.ipv4.conf.all.src_valid_mark=1 caomingjun/warp
          for i in {1..15}; do
            RESULT=$(curl -s --max-time 4 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace || true)
            echo "$RESULT"
            echo "$RESULT" | grep -qE 'warp=(on|plus)' && exit 0
            sleep 2
          done
          exit 1

      - name: Probe requested YouTube video through WARP
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --user -U --pre 'yt-dlp[default]'
          python3 -m yt_dlp --proxy 'socks5://127.0.0.1:1080' --skip-download --print '%(id)s|%(title)s|%(duration)s' 'https://www.youtube.com/watch?v=PtdI0KZRTLU'
