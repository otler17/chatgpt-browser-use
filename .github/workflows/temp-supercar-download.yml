name: Temporary Kokoro ONNX runtime bundle

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-supercar-download.yml'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download Kokoro runtime and model
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p kokoro_bundle/wheels
          python -m pip install -U pip
          python -m pip download --dest kokoro_bundle/wheels --only-binary=:all: \
            'kokoro-onnx==0.5.0' 'soundfile'
          curl -fL --retry 3 \
            -o kokoro_bundle/kokoro-v1.0.onnx \
            'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx'
          curl -fL --retry 3 \
            -o kokoro_bundle/voices-v1.0.bin \
            'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin'
          ls -lh kokoro_bundle kokoro_bundle/wheels

      - name: Upload Kokoro bundle
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-onnx-py313-bundle
          path: kokoro_bundle
          if-no-files-found: error
          retention-days: 1
