name: Temporary Scenario Studio v2 build

on:
  push:
    branches: [temp-scenario-studio-v2-build]
    paths:
      - '.github/workflows/temp-scenario-studio-v2-build.yml'
      - 'temp/v2build.part*'
      - 'temp/v2fix.b64'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/temp-scenario-studio-v2-build.yml'
      - 'temp/v2build.part*'
      - 'temp/v2fix.b64'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Scenario Studio v2 source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf /tmp/scenario-v2
          mkdir -p /tmp/scenario-v2
          cat temp/v2build.part* | base64 -d > /tmp/scenario-v2.tar.xz
          echo '31af469d81aa8e1216e98bd33fd4b6ba9e2e1dc4dd26146d191b9538c10379ac  /tmp/scenario-v2.tar.xz' | sha256sum -c -
          tar -xJf /tmp/scenario-v2.tar.xz -C /tmp/scenario-v2
          base64 -d temp/v2fix.b64 > /tmp/v2fix.tar.xz
          echo '56f3a9b95649dfd81df1146c6e0f5fd00e7955fead2a83b36309eb9b153abf92  /tmp/v2fix.tar.xz' | sha256sum -c -
          tar -xJf /tmp/v2fix.tar.xz -C /tmp/scenario-v2
          test -f /tmp/scenario-v2/package.json

      - name: Install exact dependencies
        working-directory: /tmp/scenario-v2
        shell: bash
        run: |
          set +e
          npm install --ignore-scripts=false --legacy-peer-deps --verbose
          status=$?
          if [ $status -ne 0 ]; then
            cat /home/runner/.npm/_logs/*-debug-0.log || true
            exit $status
          fi

      - name: Typecheck production package types
        working-directory: /tmp/scenario-v2
        run: npm run typecheck

      - name: Build production bundle
        working-directory: /tmp/scenario-v2
        run: npm run build

      - name: Enforce initial bundle performance gate
        working-directory: /tmp/scenario-v2
        run: npm run performance:gate | tee performance-gate.txt

      - name: Record build report
        working-directory: /tmp/scenario-v2
        shell: bash
        run: |
          set -euxo pipefail
          npm ls --depth=0 | tee npm-top-level.txt
          find dist -type f -printf '%p %s bytes\n' | sort | tee build-files.txt
          du -sh dist | tee build-size.txt
          tar -czf scenario-studio-v2-build-output.tar.gz dist package-lock.json performance-gate.txt npm-top-level.txt build-files.txt build-size.txt

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: scenario-studio-v2-build-output
          path: /tmp/scenario-v2/scenario-studio-v2-build-output.tar.gz
          retention-days: 1
          if-no-files-found: error
