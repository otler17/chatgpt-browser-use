name: FARBI fixed tunnel config patch

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/farbi-fix-trapdoor.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Add restored source artifact
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from pathlib import Path; p=Path(".github/workflows/farbi-live-host.yml"); s=p.read_text(); needle="      - name: Adapt auth routes for stable tunnel hosting\n"; art="      - name: Upload restored FARBI source for validation\n        uses: actions/upload-artifact@v4\n        with:\n          name: farbi-restored-source\n          path: farbi-project.zip\n          if-no-files-found: error\n          retention-days: 1\n\n"; assert needle in s; p.write_text(s if "name: Upload restored FARBI source for validation" in s else s.replace(needle,art+needle,1))'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/farbi-live-host.yml
          if git diff --cached --quiet; then echo "No change needed."; exit 0; fi
          git commit -m "Upload FARBI restored source for validation"
          git push origin HEAD:master
