name: Temporary supercar video download

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-supercar-download.yml'

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install ffmpeg
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download public supercar stream
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json, subprocess, urllib.request

          ids = [
              ('KidzSnnCJKU', 'POLICE vs SUPERCARS in Monaco!'),
              ('fMqTRIhfJXk', 'Real 4K HDR: TCL Supercars in HDR'),
          ]
          bases = [
              'https://pipedapi.adminforge.de',
              'https://pipedapi.leptons.xyz',
              'https://piped-api.privacy.com.de',
              'https://pipedapi.kavin.rocks',
          ]

          headers = {'User-Agent': 'Mozilla/5.0'}
          for video_id, fallback_title in ids:
              for base in bases:
                  try:
                      req = urllib.request.Request(f'{base}/streams/{video_id}', headers=headers)
                      with urllib.request.urlopen(req, timeout=25) as r:
                          data = json.load(r)
                      videos = [v for v in data.get('videoStreams', []) if v.get('url') and (v.get('height') or 0) <= 720]
                      audios = [a for a in data.get('audioStreams', []) if a.get('url')]
                      if not videos or not audios:
                          continue
                      videos.sort(key=lambda v: (v.get('height') or 0, v.get('bitrate') or 0), reverse=True)
                      audios.sort(key=lambda a: a.get('bitrate') or 0, reverse=True)
                      vurl, aurl = videos[0]['url'], audios[0]['url']
                      subprocess.run(['curl','-L','--fail','--retry','3','-o','video.part',vurl], check=True, timeout=300)
                      subprocess.run(['curl','-L','--fail','--retry','3','-o','audio.part',aurl], check=True, timeout=300)
                      subprocess.run(['ffmpeg','-y','-i','video.part','-i','audio.part','-c:v','copy','-c:a','aac','-movflags','+faststart','source.mp4'], check=True, timeout=300)
                      title = data.get('title') or fallback_title
                      open('source_title.txt','w').write(title + '\n')
                      open('source_url.txt','w').write(f'https://www.youtube.com/watch?v={video_id}\n')
                      raise SystemExit(0)
                  except Exception as e:
                      print(f'{base} / {video_id}: {e}', flush=True)
          raise SystemExit('No public stream source succeeded')
          PY
          test -s source.mp4
          ls -lh source.mp4 source_url.txt source_title.txt

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: supercar-source
          path: |
            source.mp4
            source_url.txt
            source_title.txt
          if-no-files-found: error
          retention-days: 1
