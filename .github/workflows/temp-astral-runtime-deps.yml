name: Temporary ASTRAL runtime dependency bundle

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/temp-astral-runtime-deps.yml'

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build dependency bundle
        shell: bash
        run: |
          set -euxo pipefail
          mkdir wheels
          python -m pip install -U pip wheel setuptools
          python -m pip download --dest wheels 'colorama==0.4.6' 'spiceypy' 'tqdm==4.67.1'
          python -m pip wheel --wheel-dir wheels --no-deps 'sgp4==2.23'
          ls -lh wheels
          tar -czf astral-runtime-deps-py313-linux.tar.gz wheels
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: astral-runtime-deps-py313-linux
          path: astral-runtime-deps-py313-linux.tar.gz
          retention-days: 1
      - name: Publish run id
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = '.github/astral-runtime-deps-run.txt';
            let sha;
            try {
              const current = await github.rest.repos.getContent({owner, repo, path});
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const content = Buffer.from(`${context.runId}\n`).toString('base64');
            await github.rest.repos.createOrUpdateFileContents({owner, repo, path, sha, content, message: `Record ASTRAL runtime deps run ${context.runId}`});
